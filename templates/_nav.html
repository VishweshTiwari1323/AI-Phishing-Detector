<!-- Google Fonts & Material Symbols -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

<style>
  :root {
    --bg-primary: #0a0e1a;
    --bg-secondary: #111827;
    --fg-primary: #f8fafc;
    --fg-muted: #94a3b8;
    --neon-cyan: #00f2fe;
    --neon-blue: #4facfe;
    --neon-purple: #a855f7;
    --neon-crimson: #ff0844;
    --glass-bg: rgba(10, 14, 26, 0.82);
    --glass-border: rgba(255, 255, 255, 0.08);
    --glass-border-hover: rgba(0, 242, 254, 0.3);
  }

  /* Accessibility fallback */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
    }
  }

  /* === Outer Nav Floating Container === */
  .nav-wrapper {
    position: sticky;
    top: 1rem;
    z-index: 1000;
    width: 100%;
    padding: 0 1rem;
    display: flex;
    justify-content: center;
  }

  .nav-floating {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1.5rem;
    width: 100%;
    max-width: 1280px;
    height: 68px;
    padding: 0.5rem 1.25rem;
    background: var(--glass-bg);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    border-radius: 18px;
    border-top: 1px solid var(--glass-border);
    border-left: 1px solid var(--glass-border);
    border-right: 1px solid var(--glass-border);
    border-bottom: 1px solid transparent;
    box-shadow: 0 10px 30px -10px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.03);
    transition: transform 0.3s ease, box-shadow 0.3s ease, background 0.3s ease;
    will-change: transform, box-shadow;
  }

  .nav-floating.scrolled {
    transform: translateY(-2px);
    box-shadow: 0 14px 40px -10px rgba(0, 0, 0, 0.9), 0 0 25px rgba(0, 242, 254, 0.15);
    background: rgba(10, 14, 26, 0.92);
  }

  /* === Animated Bottom Gradient Light Strip === */
  .nav-accent-line {
    position: absolute;
    bottom: -1px;
    left: 24px;
    right: 24px;
    height: 2px;
    background: linear-gradient(90deg, 
      var(--neon-cyan), 
      var(--neon-blue), 
      var(--neon-purple), 
      var(--neon-crimson),
      var(--neon-cyan)
    );
    background-size: 300% 100%;
    border-radius: 2px;
    filter: drop-shadow(0 0 8px var(--neon-cyan)) drop-shadow(0 0 16px var(--neon-purple));
    animation: gradientShift 8s linear infinite;
    pointer-events: none;
  }

  @keyframes gradientShift {
    0% { background-position: 0% 50%; }
    100% { background-position: 300% 50%; }
  }

  /* === Brand Section & Crystal Shield === */
  .brand-container {
    display: inline-flex;
    align-items: center;
    gap: 0.75rem;
    text-decoration: none;
    user-select: none;
    flex-shrink: 0;
  }

  .crystal-shield {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    background: linear-gradient(135deg, rgba(0, 242, 254, 0.15), rgba(168, 85, 247, 0.1));
    border: 1px solid rgba(0, 242, 254, 0.4);
    border-radius: 12px;
    overflow: hidden;
    transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s ease;
  }

  .crystal-shield::before {
    content: '';
    position: absolute;
    inset: -50%;
    background: conic-gradient(from 0deg, transparent, rgba(0, 242, 254, 0.4), transparent 60%);
    animation: shieldSpin 5s linear infinite;
  }

  .crystal-shield::after {
    content: '';
    position: absolute;
    inset: 1.5px;
    background: var(--bg-primary);
    border-radius: 10px;
    z-index: 1;
  }

  @keyframes shieldSpin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  .crystal-shield .shield-icon {
    position: relative;
    z-index: 2;
    font-size: 20px;
    color: #fff;
    filter: drop-shadow(0 0 6px var(--neon-cyan));
    animation: shieldPulse 3s ease-in-out infinite;
  }

  @keyframes shieldPulse {
    0%, 100% { transform: scale(1); filter: drop-shadow(0 0 4px var(--neon-cyan)); }
    50% { transform: scale(1.08); filter: drop-shadow(0 0 10px var(--neon-cyan)) drop-shadow(0 0 14px var(--neon-purple)); }
  }

  .brand-title {
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 1rem;
    font-weight: 700;
    color: var(--fg-primary);
    letter-spacing: -0.01em;
    white-space: nowrap;
    text-shadow: 0 0 12px rgba(0, 242, 254, 0.2);
  }

  /* === Nav Links & Sliding Indicator === */
  .nav-links-wrapper {
    position: relative;
    display: flex;
    align-items: center;
    gap: 0.25rem;
  }

  .nav-link {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.5rem 0.85rem;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 0.875rem;
    font-weight: 500;
    color: var(--fg-muted);
    text-decoration: none;
    border-radius: 10px;
    transition: color 0.2s ease, transform 0.2s ease;
    z-index: 2;
    white-space: nowrap;
  }

  .nav-link:hover {
    color: var(--fg-primary);
    transform: translateY(-1px);
  }

  .nav-link.active {
    color: #ffffff;
    font-weight: 600;
  }

  .nav-badge-pill {
    background: rgba(255, 255, 255, 0.04);
    border: 1px solid var(--glass-border);
    border-radius: 999px;
    padding: 0.4rem 0.85rem;
  }

  .nav-badge-pill:hover {
    border-color: rgba(0, 242, 254, 0.3);
    background: rgba(0, 242, 254, 0.05);
  }

  .badge-pulse-dot {
    width: 6px;
    height: 6px;
    background: var(--neon-cyan);
    border-radius: 50%;
    box-shadow: 0 0 8px var(--neon-cyan);
    animation: pulseDot 2s infinite ease-in-out;
  }

  @keyframes pulseDot {
    0%, 100% { transform: scale(1); opacity: 1; }
    50% { transform: scale(0.65); opacity: 0.4; }
  }

  /* Sliding Indicator */
  .nav-indicator {
    position: absolute;
    bottom: -4px;
    height: 2.5px;
    background: linear-gradient(90deg, var(--neon-cyan), var(--neon-blue));
    border-radius: 4px;
    box-shadow: 0 0 12px var(--neon-cyan), 0 0 20px var(--neon-blue);
    transition: left 0.35s cubic-bezier(0.4, 0, 0.2, 1), width 0.35s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.2s ease;
    z-index: 1;
    pointer-events: none;
    opacity: 0;
  }

  /* === Vertical Glowing Divider === */
  .nav-divider {
    width: 1.5px;
    height: 26px;
    background: linear-gradient(180deg, rgba(0, 242, 254, 0.8), rgba(168, 85, 247, 0.8));
    border-radius: 999px;
    box-shadow: 0 0 8px rgba(0, 242, 254, 0.6);
    margin: 0 0.5rem;
    flex-shrink: 0;
  }

  /* === Action Micro-Interactions === */
  .action-group {
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }

  .action-btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 36px;
    height: 36px;
    color: var(--fg-muted);
    background: rgba(255, 255, 255, 0.02);
    border: 1px solid var(--glass-border);
    border-radius: 10px;
    text-decoration: none;
    transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .action-btn:hover {
    color: var(--fg-primary);
    background: rgba(0, 242, 254, 0.08);
    border-color: rgba(0, 242, 254, 0.3);
    transform: translateY(-2px);
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4), 0 0 12px rgba(0, 242, 254, 0.2);
  }

  /* Analytics Equalizer Effect */
  .nav-analytics:hover .bar {
    animation: barBounce 0.8s ease-in-out infinite alternate;
  }
  .nav-analytics .bar-chart-icon {
    display: flex;
    align-items: flex-end;
    gap: 2.5px;
    height: 16px;
  }
  .nav-analytics .bar {
    width: 3px;
    background: var(--neon-purple);
    border-radius: 1px;
    box-shadow: 0 0 6px var(--neon-purple);
    transition: height 0.2s ease;
  }
  .bar-1 { height: 6px; }
  .bar-2 { height: 14px; animation-delay: 0.15s !important; }
  .bar-3 { height: 9px; animation-delay: 0.3s !important; }

  @keyframes barBounce {
    0% { height: 4px; }
    100% { height: 16px; }
  }

  /* Terminal Cursor Effect */
  .nav-terminal .terminal-cursor {
    display: inline-block;
    width: 2px;
    height: 13px;
    background: var(--neon-cyan);
    margin-left: 2px;
    vertical-align: middle;
    animation: cursorBlink 1s step-end infinite;
    box-shadow: 0 0 6px var(--neon-cyan);
  }

  @keyframes cursorBlink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0; }
  }

  /* History Clock Rotation */
  .nav-history:hover .material-symbols-outlined {
    transform: rotate(-45deg);
    transition: transform 0.3s ease;
    color: var(--neon-purple);
    filter: drop-shadow(0 0 6px var(--neon-purple));
  }

  /* === Sign Out CTA Button === */
  .nav-signout-btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.5rem 1.15rem;
    font-family: 'Plus Jakarta Sans', sans-serif;
    font-size: 0.8125rem;
    font-weight: 600;
    color: var(--fg-primary);
    background: rgba(255, 255, 255, 0.03);
    border: 1px solid rgba(255, 8, 68, 0.4);
    border-radius: 999px;
    text-decoration: none;
    cursor: pointer;
    overflow: hidden;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    white-space: nowrap;
    flex-shrink: 0;
  }

  .nav-signout-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255, 8, 68, 0.2), rgba(168, 85, 247, 0.2));
    opacity: 0;
    transition: opacity 0.3s ease;
    z-index: 0;
  }

  .nav-signout-btn:hover {
    border-color: var(--neon-crimson);
    transform: translateY(-1px) scale(1.02);
    box-shadow: 0 0 20px rgba(255, 8, 68, 0.3);
  }

  .nav-signout-btn:hover::before {
    opacity: 1;
  }

  .nav-signout-btn .arrow-icon {
    position: relative;
    z-index: 1;
    font-size: 16px;
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  }

  .nav-signout-btn:hover .arrow-icon {
    transform: translateX(3px);
    color: var(--neon-crimson);
  }

  .nav-signout-btn span {
    position: relative;
    z-index: 1;
  }

  /* Responsive / Mobile Breakpoints */
  .mobile-menu-btn {
    display: none;
    background: transparent;
    border: none;
    color: var(--fg-primary);
    cursor: pointer;
    padding: 0.5rem;
  }

  @media (max-width: 992px) {
    .nav-links-wrapper, .nav-divider, .action-group {
      display: none;
    }
    .mobile-menu-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
  }
</style>

<div class="nav-wrapper">

    <div class="nav-links-wrapper">

  </nav>
</div>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const navFloating = document.getElementById('mainNavbar');
    const indicator = document.getElementById('navIndicator');
    const navLinks = document.querySelectorAll('.nav-link');
    const linksWrapper = document.querySelector('.nav-links-wrapper');

    // Smooth indicator movement
    function positionIndicator(target) {
      if (!target || !indicator || !linksWrapper) return;
      const targetRect = target.getBoundingClientRect();
      const wrapperRect = linksWrapper.getBoundingClientRect();

      const left = targetRect.left - wrapperRect.left + (targetRect.width * 0.15);
      const width = targetRect.width * 0.7;

      indicator.style.left = `${left}px`;
      indicator.style.width = `${width}px`;
      indicator.style.opacity = '1';
    }

    // Initialize position on active element
    const activeLink = document.querySelector('.nav-link.active') || navLinks[0];
    if (activeLink) {
      setTimeout(() => positionIndicator(activeLink), 100);
    }

    // Magnetic hover transitions
    navLinks.forEach(link => {
      link.addEventListener('mouseenter', () => positionIndicator(link));
      link.addEventListener('click', function() {
        navLinks.forEach(l => l.classList.remove('active'));
        this.classList.add('active');
        positionIndicator(this);
      });
    });

    // Snap back on mouse leave
    linksWrapper.addEventListener('mouseleave', () => {
      const currentActive = document.querySelector('.nav-link.active');
      if (currentActive) {
        positionIndicator(currentActive);
      }
    });

    // Window resize recalculation
    window.addEventListener('resize', () => {
      const currentActive = document.querySelector('.nav-link.active');
      if (currentActive) positionIndicator(currentActive);
    });

    // Scroll effect
    window.addEventListener('scroll', () => {
      if (window.scrollY > 40) {
        navFloating.classList.add('scrolled');
      } else {
        navFloating.classList.remove('scrolled');
      }
    }, { passive: true });
  });
</script>
